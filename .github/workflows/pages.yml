name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium
      - name: Build deploy artifact
        env:
          PSPF_BASE: /PSPF-Explorer/
        run: npm run build
      - run: npm run perf:budget
      - name: Browser smoke test deploy artifact
        env:
          PSPF_BASE: /PSPF-Explorer/
        run: npm run test:e2e -- --project=chromium tests/e2e/smoke.spec.ts tests/e2e/navigation.spec.ts
      - name: Generate SBOM
        run: npm run sbom
      - name: Stage SBOM into dist
        run: cp sbom.json dist/sbom.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
